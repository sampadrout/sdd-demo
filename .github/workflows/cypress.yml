name: Cypress

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover specs so new *.cy.ts files get their own parallel job automatically.
  discover:
    name: Discover specs
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          specs=$(find cypress/e2e -name '*.cy.ts' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Discovered: $specs"

  e2e:
    name: e2e (${{ matrix.spec }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.discover.outputs.specs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: ${{ matrix.spec }}
        env:
          CYPRESS_BASE_URL: https://parabank.parasoft.com/parabank

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ strategy.job-index }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
